# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        exclude: ^diagrams/
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^diagrams/
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4 # v3.21.2
    hooks:
      - id: pyupgrade
        args: [--keep-percent-format, --py312-plus]
  - repo: https://github.com/pycqa/flake8
    rev: c48217e1fc006c2dddd14df54e83b67da15de5cd # 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear==25.11.29
          - flake8-builtins==3.1.0
          - flake8-docstrings==1.7.0
          - flake8-picky-parentheses==0.6.2
          - flake8-quotes==3.4.0
          - pep8-naming==0.15.1
  - repo: https://github.com/pycqa/isort
    rev: 131f4adcd5582bfc53928ab0d740eceb8b506b6c # 9.0.1
    hooks:
      - id: isort
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path boltstub_rs/Cargo.toml --
        language: system
        types: [rust]
        pass_filenames: false
  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path boltstub_rs/Cargo.toml --all-features --tests -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
