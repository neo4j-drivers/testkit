[package]
name = "boltstub"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
constcat = "0.6.1"
derive_more = { version = "2.1.1", features = ["display"] }
fern = { version = "0.7.1" }
indexmap = "2.14.2"
indoc = "2.0.7"
itertools = "0.15.0"
log = "0.4.34"
nom = "8.0.0"
nom_locate = "5.0.0"
pyo3 = "0.29.2"
regex = "1.13.1"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["default", "preserve_order"] }
termcolor = "1.4.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
usize_cast = "1.1.0"
pin-project = "1.1.13"
sha1 = "0.11.0"
base64 = "0.23.1"
uuid = "1.26.1"
rstest_reuse = "0.7.0"

[dev-dependencies]
rstest = "0.27.0"
